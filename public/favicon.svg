<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff" />
      <stop offset="100%" stop-color="#863bff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c1e" />
      <stop offset="100%" stop-color="#0b0f10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian Background with rounded corners and subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#d0bcff" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sleek Modern Monogram 'J' -->
  <path d="M 38 18 L 38 38 C 38 45 32 48 25 48 C 19 48 15 44 14 40" 
        stroke="url(#glowGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Glowing Violet Dot Accent -->
  <circle cx="24" cy="18" r="3" fill="#d0bcff" />
</svg>