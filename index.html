<!DOCTYPE html>
<!--
  tasteskill 2.5 — service site
  kind: service | page-type: service | site-kind: other
  palette: cool-grey-cobalt | type: Instrument Sans | radius: soft | buttons: tonal
  nav: nav-split | footer: footer-columns | close: close-type | rhythm: space | mark: stack
  hero: photo (full-bleed photograph, calm side left)
  moments: 1 pinned-chapters (work section), 2 word-highlight (statement section)
  photographs: public/images/me/resource_speaker.webp (hero, the client's own photo — facilitating a Scratch Foundation session)
-->
<html lang="en" data-type="service" data-radius="soft" data-buttons="tonal" data-motion>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="page-type" content="service" />
    <meta name="site-kind" content="other" />
    <title>Jude Almaden — Fullstack Web Developer for hire</title>
    <meta name="description" content="Fullstack web developer specialising in Laravel, React and Next.js. 11 shipped applications, Magna Cum Laude graduate, internship at Open iT." />
    <meta property="og:title" content="Jude Almaden — Fullstack Web Developer" />
    <meta property="og:description" content="11 shipped applications. Laravel, React and Next.js. Available for contract and full-time roles." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://judealmaden.github.io/Portfolio/" />
    <meta property="og:site_name" content="Jude Almaden" />
    <meta property="og:image" content="https://judealmaden.github.io/Portfolio/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jude Almaden — junior full-stack developer, Laravel, React and Next.js" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jude Almaden — Fullstack Web Developer" />
    <meta name="twitter:description" content="11 shipped applications. Laravel, React and Next.js. Available for contract and full-time roles." />
    <meta name="twitter:image" content="https://judealmaden.github.io/Portfolio/og-image.png" />
    <link rel="canonical" href="https://judealmaden.github.io/Portfolio/" />
    <meta name="theme-color" content="#1a4be0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Instrument Sans — dealt pairing for service/devtool -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />

    <!-- Devicons (kept: real coloured tool icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <!-- tasteskill kit -->
    <link rel="stylesheet" href="/assets/system.css" />
    <link rel="stylesheet" href="/assets/ui/base.css" />
    <link rel="stylesheet" href="/assets/ui/cards.css" />
    <link rel="stylesheet" href="/assets/motion/motion.css" />
    <link rel="stylesheet" href="/assets/backgrounds/backgrounds.css" />
    <link rel="stylesheet" href="/assets/layout/layout.css" />
    <link rel="stylesheet" href="/assets/icons/icon.css" />

    <!-- dealt palette + type tokens -->
    <style>
      :root {
        --p-bg: #eef0f3; --p-surface: #e2e5ea; --p-ink: #0b0c0e; --p-muted: #5d6470;
        --p-accent: #1f2de6; --p-accent-ink: #ffffff; --p-action: #1f2de6; --p-action-ink: #ffffff;
        --p-inv-bg: #0b0c0e; --p-inv-surface: #17181a; --p-inv-ink: #eef0f3; --p-inv-muted: #8e8f92;
        --p-inv-accent: #eef0f3; --p-inv-accent-ink: #0b0c0e; --p-inv-action: #eef0f3; --p-inv-action-ink: #0b0c0e;
        --font-display: "Instrument Sans", system-ui, sans-serif;
        --font-text: "Instrument Sans", system-ui, sans-serif;
        --display-weight: 400;
        --display-tracking: -0.028em;
        --display-tracking-xl: -0.036em;
        --display-stretch: 96%;
        --ly-scale: 1.04;
      }
    </style>

    <!-- hero entrance: the hold is set before the first paint. The kit's 700ms mark is for a static
         page; this one mounts React first, so the mark waits long enough for the mount and the kit
         load. It is motion.css's fallback only: if the layer never arrives the words fade in. -->
    <script>
      document.documentElement.classList.add('m-enter');
      setTimeout(() => document.documentElement.classList.add('m-enter-done'), 2500);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- the kit's scripts (public/assets) are loaded by src/kit.js once React has rendered -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
